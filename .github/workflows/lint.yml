# This GitHub Action checks for common issues in HTML files using HTMLHint.

name: HTML Linting

# This workflow runs when code is pushed to the 'main' branch.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run HTMLHint
        uses: reviewdog/action-htmlhint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review # Reports issues directly in the PR review
          level: warning # Set threshold for reporting
          files: 'index.html'
